<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tareas</title>
  <meta name="description" content="Tablero de tarjetas de tareas: por hacer, en curso y hecho.">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#2e6a4f">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="tareas.css">
  <script>
    // Aplica el tema guardado antes de pintar (comparte la preferencia con el libro).
    try { const t = JSON.parse(localStorage.getItem("lp:theme")); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../" title="Volver al Libro de Pastoreo">
      <img src="../icons/icon.svg" alt="" width="28" height="28">
      <span>Tareas</span>
    </a>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="filter" type="search" placeholder="Filtrar tarjetas" aria-label="Filtrar tarjetas">
    </div>
    <div class="tools">
      <button id="btn-theme" aria-label="Cambiar entre tema claro y oscuro" title="Tema claro / oscuro">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      </button>
      <button class="primary" id="btn-add" title="Nueva tarjeta">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>Nueva</span>
      </button>
    </div>
  </header>

  <main class="board" id="board" aria-label="Tablero de tareas"></main>

  <dialog id="editor" aria-labelledby="editor-title">
    <form method="dialog" id="editor-form">
      <h2 id="editor-title">Nueva tarjeta</h2>
      <label>Título
        <input name="title" required maxlength="120" autocomplete="off">
      </label>
      <label>Notas
        <textarea name="notes" rows="4" maxlength="2000"></textarea>
      </label>
      <div class="row">
        <label>Fecha límite
          <input name="due" type="date">
        </label>
        <label>Columna
          <select name="col"></select>
        </label>
      </div>
      <fieldset class="colors">
        <legend>Color</legend>
        <div id="color-list"></div>
      </fieldset>
      <div class="actions">
        <button type="button" class="danger" id="btn-delete">Eliminar</button>
        <span class="spacer"></span>
        <button type="button" id="btn-cancel">Cancelar</button>
        <button type="submit" class="primary" value="save">Guardar</button>
      </div>
    </form>
  </dialog>

  <noscript><p style="padding:16px">Esta página necesita JavaScript.</p></noscript>
  <script src="tareas.js"></script>
</body>
</html>
