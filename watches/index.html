<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CIG Timepieces</title>
  <meta name="description" content="Inventory, sales, profit, pre-ship checks and documents for a watch business.">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#0b0b0c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CIG Timepieces">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" id="brand" aria-label="CIG Timepieces"></div>
    <button class="btn primary" id="btn-add" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Add watch</span>
    </button>
  </header>

  <nav class="tabs" id="tabs" aria-label="Sections">
    <a href="#dashboard" data-tab="dashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Numbers</span>
    </a>
    <a href="#inventory" data-tab="inventory">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6"/><path d="M12 9v3l2 1M9 3h6M9 21h6"/></svg><span>Inventory</span>
    </a>
    <a href="#market" data-tab="market">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg><span>Market</span>
    </a>
    <a href="#settings" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v12H4zM9 7V5h6v2M4 12h16"/></svg><span>Business</span>
    </a>
  </nav>

  <main id="view" tabindex="-1"></main>

  <dialog id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button class="icon-btn" type="button" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </dialog>

  <dialog id="ask" class="ask" aria-label="Confirm"></dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:16px">This app needs JavaScript.</p></noscript>
  <script src="catalog.js"></script>
  <script src="docs.js"></script>
  <script src="app.js"></script>
</body>
</html>
