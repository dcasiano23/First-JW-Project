<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Watch Ledger</title>
  <meta name="description" content="Inventory, sales, profit and market comps for a watch business.">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#1d2b3a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Watch Ledger">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icon.svg" alt="" width="26" height="26"><span>Watch Ledger</span></div>
    <button class="btn primary" id="btn-add" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Add watch</span>
    </button>
  </header>

  <nav class="tabs" id="tabs" aria-label="Sections">
    <a href="#dashboard" data-tab="dashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Numbers</span>
    </a>
    <a href="#inventory" data-tab="inventory">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6"/><path d="M12 9v3l2 1M9 3h6M9 21h6"/></svg><span>Inventory</span>
    </a>
    <a href="#market" data-tab="market">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg><span>Market</span>
    </a>
    <a href="#settings" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Backup</span>
    </a>
  </nav>

  <main id="view" tabindex="-1"></main>

  <dialog id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button class="icon-btn" type="button" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:16px">This app needs JavaScript.</p></noscript>
  <script src="app.js"></script>
</body>
</html>
